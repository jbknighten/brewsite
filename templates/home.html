<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BrewSite Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f1ea;
        }

        h1 {
            color: #5c3a21;
        }

        .images {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .images img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Welcome to BrewSite</h1>

    <p>
        Welcome to my BrewSite Flask application. This website provides
        information about breweries while demonstrating Python, Flask,
        HTML, Git, and GitHub.
    </p>

    <p>
        <a href="/brewery">View Brewery Information</a>
    </p>

    <h2>Brewery Gallery</h2>

    <div class="images">
        <img src="https://picsum.photos/300/200?random=1" alt="Brewery Image 1">
        <img src="https://picsum.photos/300/200?random=2" alt="Brewery Image 2">
        <img src="https://picsum.photos/300/200?random=3" alt="Brewery Image 3">
    </div>

</body>
</html>
